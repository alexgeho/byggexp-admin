name: CI

# Runs on every push and pull request. `next build` type-checks, lints the
# app, and runs the React Compiler, so a broken change fails here before it can
# reach main / a deploy.
on:
  push:
    branches-ignore: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-admin-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_API_URL: https://api.byggexp.se
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20.20.2'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      # Gate: unit + component tests (incl. the guard that every create form in
      # a modal has a submit button). A hang must not stall the job.
      - name: Run tests
        run: npm test
        timeout-minutes: 10

      - name: Build
        run: npm run build
